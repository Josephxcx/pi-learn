<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Pi-learn. Make it click.</title><desc id="desc">A personal tutor for Pi. Understand one idea, practise it, and return to what you have learned. A botanical illustration shows the growing tip, young leaves, older leaves and roots of a plant.</desc>
<rect width="1200" height="560" rx="20" fill="#eaf3f5"/>
<path d="M20 0H670Q625 140 665 280T640 560H20Q0 560 0 540V20Q0 0 20 0" fill="#123b58"/>
<g fill="#fff" font-family="Arial, Helvetica, sans-serif">
<text x="54" y="70" font-size="27" font-weight="700">π / pi-learn</text>
<text x="54" y="194" font-family="Georgia, serif" font-size="84">Make it</text>
<text x="54" y="282" font-family="Georgia, serif" font-size="84">click.</text>
<text x="57" y="338" font-size="23" fill="#d6e9f1">A personal tutor for curious minds.</text>
<text x="57" y="372" font-size="23" fill="#d6e9f1">Visual explanations. Practice. Recall.</text>
<path d="M57 422H563" stroke="#7295aa" stroke-width="1"/>
<g font-size="18"><text x="57" y="461">Understand</text><text x="266" y="461">Practise</text><text x="458" y="461">Revisit</text></g>
<path d="M181 454H235m-7-5 7 5-7 5M356 454H428m-7-5 7 5-7 5" fill="none" stroke="#a9d788" stroke-width="2"/>
<text x="57" y="514" font-size="16" fill="#bcd5e3">Built for Pi · Saved in your own notes</text>
</g><svg x="685" y="8" width="480" height="548" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 790" role="img" aria-labelledby="plant-title plant-description">
<title id="plant-title">A growing plant, from emerging tip to mature leaves and roots</title>
<desc id="plant-description">An illustrated broadleaf plant with folded new growth, curved leaves, branching veins, petioles and a branching root system. Leader lines identify the growing tip, young leaves and older leaves. The yellow-green colour of lower leaves is illustrative.</desc>
<defs>
  <linearGradient id="leaf-young" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#97bb6b"/><stop offset=".48" stop-color="#5f944f"/><stop offset="1" stop-color="#305b39"/></linearGradient>
  <linearGradient id="leaf-mature" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#bad083"/><stop offset=".46" stop-color="#61934e"/><stop offset="1" stop-color="#315e3d"/></linearGradient>
  <linearGradient id="leaf-older" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbd37b"/><stop offset=".5" stop-color="#a8b05a"/><stop offset="1" stop-color="#6e8442"/></linearGradient>
  <linearGradient id="stem-shade"><stop stop-color="#385e37"/><stop offset=".45" stop-color="#82a663"/><stop offset="1" stop-color="#466c42"/></linearGradient>
  <g id="leaf-broad">
    <path d="M0 0 Q-16 -10 -27 -17" fill="none" stroke="#62864c" stroke-width="3.5"/>
    <path d="M-25 -16 C-43 -5 -63 -11 -81 -23 C-101 -30 -105 -43 -119 -55 C-135 -65 -137 -82 -163 -101 C-140 -96 -122 -103 -100 -93 C-79 -91 -65 -78 -52 -66 C-36 -51 -29 -33 -25 -16Z" fill="inherit" stroke="#355c3b" stroke-width="1.2"/>
    <path d="M-27 -18 C-61 -42 -113 -79 -160 -99" fill="none" stroke="#d2dca0" stroke-width="2.1"/>
    <g fill="none" stroke="#d1d99b" stroke-width="1.15" opacity=".8">
      <path d="M-45 -31 Q-43 -41 -49 -58 M-60 -43 Q-61 -61 -75 -79 M-78 -56 Q-84 -77 -104 -90 M-96 -68 Q-108 -88 -128 -97"/>
      <path d="M-46 -31 Q-63 -26 -76 -28 M-65 -47 Q-86 -40 -103 -43 M-84 -59 Q-105 -53 -119 -57 M-104 -73 Q-124 -70 -138 -79"/>
    </g>
    <path d="M-28 -18 Q-65 -8 -95 -32" fill="none" stroke="#eff2ca" stroke-width="1" opacity=".45"/>
  </g>
  <g id="leaf-narrow">
    <path d="M0 0 Q-15 -9 -24 -18" fill="none" stroke="#62864c" stroke-width="3"/>
    <path d="M-22 -17 C-47 -13 -62 -34 -75 -50 C-91 -68 -98 -95 -116 -115 C-87 -103 -70 -102 -51 -80 C-35 -64 -25 -40 -22 -17Z" fill="url(#leaf-young)" stroke="#466b40" stroke-width="1"/>
    <path d="M-24 -19 Q-65 -59 -114 -113 M-44 -42 L-40 -61 M-58 -57 L-57 -80 M-76 -77 L-82 -99 M-45 -43 L-59 -37 M-61 -60 L-79 -56 M-80 -83 L-95 -82" fill="none" stroke="#d8e6ad" stroke-width="1.3"/>
  </g>
</defs>
<!-- The stem is tapered and curved; leaves connect through short petioles. -->
<path d="M326 586 C337 540 329 477 335 422 C342 363 326 306 335 254 C342 202 331 149 335 97 L340 96 C335 151 348 206 343 253 C334 310 350 366 343 424 C336 481 345 542 335 587Z" fill="url(#stem-shade)"/>
<path d="M338 111 C337 244 333 278 340 360" fill="none" stroke="#b2c790" stroke-width="1.3" opacity=".7"/>
<!-- Mid-age leaves, deliberately varied in size and orientation. -->
<g opacity=".96">
  <use href="#leaf-broad" transform="translate(336 340) rotate(-8) scale(.93 .91)" fill="url(#leaf-mature)"/>
  <use href="#leaf-broad" transform="translate(344 322) rotate(5) scale(-.98 .92)" fill="url(#leaf-mature)"/>
</g>
<g data-tissue="older" data-active="true">
  <use href="#leaf-broad" transform="translate(335 474) rotate(-15) scale(1.18 1.12)" fill="url(#leaf-older)"/>
  <use href="#leaf-broad" transform="translate(341 445) rotate(18) scale(-1.12 1.16)" fill="url(#leaf-older)"/>
</g>
<g data-tissue="young" data-active="false">
  <use href="#leaf-narrow" transform="translate(335 230) rotate(8) scale(.92)"/>
  <use href="#leaf-narrow" transform="translate(340 204) rotate(14) scale(-.78 .8)"/>
</g>
<g data-tissue="tip" data-active="false">
  <path d="M337 106 C319 85 316 69 323 44 C337 63 345 77 337 106Z" fill="#81aa5c" stroke="#486c3d"/>
  <path d="M337 107 C334 83 342 65 355 56 C357 81 353 100 337 107Z" fill="#4e803f" stroke="#385f34"/>
  <path d="M338 104 Q335 77 323 46 M339 102 Q347 81 354 59" stroke="#c8dfa0" stroke-width="1.4" fill="none"/>
</g>
<!-- Root crown and branching laterals beneath the ground plane. -->
<path d="M331 574 C325 614 337 639 325 679 C322 701 324 726 319 752" fill="none" stroke="#8b6e48" stroke-width="7" stroke-linecap="round"/>
<g fill="none" stroke="#a08860" stroke-width="2.8" stroke-linecap="round">
  <path d="M331 592 C310 604 292 611 281 634 C269 651 247 657 235 675 M330 614 C352 623 374 620 387 640 C402 656 417 653 435 669 M331 640 C309 654 299 671 285 690 C275 709 259 714 253 734 M326 673 C346 681 354 705 371 722 M332 589 C350 599 358 607 372 609 M326 696 C313 707 306 727 298 744"/>
</g>
<g fill="none" stroke="#b09b78" stroke-width="1.4" stroke-linecap="round">
  <path d="M285 628 L260 633 L251 649 M273 649 Q246 647 229 659 M249 663 Q248 684 235 696 M367 625 Q388 616 404 629 M391 644 Q392 670 410 682 M415 657 Q431 649 447 655 M297 674 L277 675 L267 690 M276 708 Q280 724 270 740 M350 698 Q338 718 342 740 M365 714 Q389 713 399 729 M352 601 L355 587 M312 709 Q291 708 281 719"/>
</g>
<path d="M145 574 Q245 571 319 575 M349 575 Q446 572 545 574" fill="none" stroke="#b6c0ac" stroke-width="1.4" stroke-dasharray="4 6"/>
<!-- Labels are kept outside the foliage, with endpoints at the relevant tissue. -->
<g class="plant-leaders" fill="none" stroke="#70806b" stroke-width="1.3">
  <path d="M453 61 H404 L348 78"/><path d="M104 164 H207 L281 170"/><path d="M475 354 H530 L490 410"/>
</g>
<g fill="#476046"><circle cx="348" cy="78" r="3"/><circle cx="281" cy="170" r="3"/><circle cx="490" cy="410" r="3"/></g>
<g fill="#203829" font-family="system-ui,sans-serif" font-size="27">
  <text x="458" y="51">Growing tip</text><text x="34" y="155">Young leaves</text><text x="458" y="340">Older leaves</text>
</g>
<text x="460" y="604" fill="#627464" font-family="system-ui,sans-serif" font-size="21">Root uptake</text>
</svg>
