<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="850" height="420" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="425" y="40" fill="#f8fafc" font-size="20" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    Sample AI-Generated Visual Diagram (Embedded in Note)
  </text>
  <text x="425" y="65" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    High-contrast vector SVG automatically rendered and verified before note insertion
  </text>

  <!-- Left Box: Component A -->
  <g transform="translate(50, 110)" filter="url(#glow)">
    <rect width="210" height="180" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="10"/>
    <rect x="0" y="0" width="210" height="36" fill="#0284c7" rx="10 10 0 0"/>
    <text x="105" y="24" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1. INPUT / STIMULUS</text>
    <circle cx="105" cy="85" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="91" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">hν / e⁻</text>
    <text x="105" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle">Excitation Energy</text>
    <text x="105" y="165" fill="#94a3b8" font-size="10" text-anchor="middle">Photon absorption</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(275, 190)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4"/>
    <polygon points="65,-6 77,0 65,6" fill="#38bdf8"/>
    <text x="35" y="-12" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Transfer</text>
  </g>

  <!-- Center Box: Component B -->
  <g transform="translate(365, 110)" filter="url(#glow)">
    <rect width="210" height="180" fill="#1e293b" stroke="#22c55e" stroke-width="2" rx="10"/>
    <rect x="0" y="0" width="210" height="36" fill="#16a34a" rx="10 10 0 0"/>
    <text x="105" y="24" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2. TRANSFORMATION</text>
    <circle cx="105" cy="85" r="28" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="105" y="91" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">ΔG &lt; 0</text>
    <text x="105" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle">Coupled Reaction</text>
    <text x="105" y="165" fill="#94a3b8" font-size="10" text-anchor="middle">Proton-motive force</text>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(590, 190)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#22c55e" stroke-width="3" stroke-dasharray="4"/>
    <polygon points="65,-6 77,0 65,6" fill="#22c55e"/>
    <text x="35" y="-12" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="middle">Synthesis</text>
  </g>

  <!-- Right Box: Component C -->
  <g transform="translate(680, 110)" filter="url(#glow)">
    <rect width="120" height="180" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="10"/>
    <rect x="0" y="0" width="120" height="36" fill="#d97706" rx="10 10 0 0"/>
    <text x="60" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3. OUTPUT</text>
    <circle cx="60" cy="85" r="24" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="60" y="90" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">ATP</text>
    <text x="60" y="145" fill="#cbd5e1" font-size="10" text-anchor="middle">Chemical</text>
    <text x="60" y="165" fill="#94a3b8" font-size="9" text-anchor="middle">Storage</text>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(50, 325)">
    <rect width="750" height="55" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="8"/>
    <text x="375" y="24" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">
      🔑 Ground-Truth Verification: The agent renders and inspects images before final placement
    </text>
    <text x="375" y="44" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">
      Ensures zero overlapping labels, crisp typography, and accurate spatial layouts
    </text>
  </g>
</svg>
