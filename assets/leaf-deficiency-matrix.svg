<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" fill="url(#darkBg)" rx="14"/>

  <!-- Title Banner -->
  <text x="480" y="38" fill="#f1f5f9" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">
    Visual Diagnostic Key: Plant Nutrient Deficiency Symptoms
  </text>
  <text x="480" y="60" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">
    Categorized by leaf position and visual symptom signature
  </text>

  <!-- SECTION 1: OLDER / LOWER LEAVES (Mobile) -->
  <g transform="translate(30, 80)">
    <rect width="435" height="490" fill="#1e293b" stroke="#f97316" stroke-width="1.5" rx="10" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="435" height="34" fill="#ea580c" rx="10 10 0 0"/>
    <text x="217" y="22" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">
      OLDER / LOWER LEAVES (Mobile Nutrients)
    </text>

    <!-- N Item -->
    <g transform="translate(15, 48)">
      <rect width="405" height="95" fill="#0f172a" stroke="#334155" rx="8"/>
      <circle cx="28" cy="28" r="16" fill="#fbbf24"/>
      <text x="28" y="34" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">N</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="bold">Uniform Chlorosis (V-Shaped in Maize)</text>
      <text x="56" y="46" fill="#cbd5e1" font-size="11">Starts from leaf tip and moves along midrib. Whole leaf turns yellow.</text>
      <text x="56" y="66" fill="#38bdf8" font-size="10" font-weight="bold">Diagnostic: Leaf Color Chart (LCC) calibrated for N dressing</text>
    </g>

    <!-- P Item -->
    <g transform="translate(15, 155)">
      <rect width="405" height="95" fill="#0f172a" stroke="#334155" rx="8"/>
      <circle cx="28" cy="28" r="16" fill="#a855f7"/>
      <text x="28" y="34" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">P</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="bold">Purple / Bronze Discoloration</text>
      <text x="56" y="46" fill="#cbd5e1" font-size="11">Anthocyanin pigment accumulation due to blocked sugar metabolism.</text>
      <text x="56" y="66" fill="#c084fc" font-size="10" font-weight="bold">Diagnostic: Stunted root growth; delayed maturity</text>
    </g>

    <!-- K Item -->
    <g transform="translate(15, 262)">
      <rect width="405" height="95" fill="#0f172a" stroke="#334155" rx="8"/>
      <circle cx="28" cy="28" r="16" fill="#ef4444"/>
      <text x="28" y="34" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">K</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="bold">Marginal Scorch / Leaf Firing</text>
      <text x="56" y="46" fill="#cbd5e1" font-size="11">Yellowing and necrosis along leaf margins (edges) while center stays green.</text>
      <text x="56" y="66" fill="#f87171" font-size="10" font-weight="bold">Diagnostic: Weak stems / lodging; poor stomatal regulation</text>
    </g>

    <!-- Mg Item -->
    <g transform="translate(15, 369)">
      <rect width="405" height="100" fill="#0f172a" stroke="#334155" rx="8"/>
      <circle cx="28" cy="28" r="16" fill="#10b981"/>
      <text x="28" y="34" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Mg</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="bold">Interveinal Chlorosis (Inverted 'V')</text>
      <text x="56" y="46" fill="#cbd5e1" font-size="11">Veins remain dark green while interveinal areas turn pale yellow/white.</text>
      <text x="56" y="66" fill="#34d399" font-size="10" font-weight="bold">Diagnostic: "Sand drown" disease in tobacco; Mg is central atom of chlorophyll</text>
    </g>
  </g>

  <!-- SECTION 2: YOUNGER LEAVES & BUDS (Immobile/Less Mobile) -->
  <g transform="translate(495, 80)">
    <rect width="435" height="490" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="10" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="435" height="34" fill="#0284c7" rx="10 10 0 0"/>
    <text x="217" y="22" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">
      YOUNG LEAVES &amp; MERISTEMS (Immobile / Less Mobile)
    </text>

    <!-- Fe Item -->
    <g transform="translate(15, 48)">
      <rect width="405" height="95" fill="#0f172a" stroke="#334155" rx="8"/>
      <circle cx="28" cy="28" r="16" fill="#e2e8f0"/>
      <text x="28" y="34" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Fe</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="bold">Severe Interveinal Chlorosis (Ivory/White)</text>
      <text x="56" y="46" fill="#cbd5e1" font-size="11">Fine network of dark green veins on bleached ivory background.</text>
      <text x="56" y="66" fill="#38bdf8" font-size="10" font-weight="bold">Diagnostic: Common in calcareous soils (high pH locks Fe)</text>
    </g>

    <!-- S Item -->
    <g transform="translate(15, 155)">
      <rect width="405" height="95" fill="#0f172a" stroke="#334155" rx="8"/>
      <circle cx="28" cy="28" r="16" fill="#fde047"/>
      <text x="28" y="34" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">S</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="bold">Uniform Pale Yellow (Younger Leaves)</text>
      <text x="56" y="46" fill="#cbd5e1" font-size="11">Mimics N deficiency, but localized specifically to youngest new foliage.</text>
      <text x="56" y="66" fill="#facc15" font-size="10" font-weight="bold">Diagnostic: Essential for amino acids (Methionine, Cysteine)</text>
    </g>

    <!-- Ca & B (Terminal Bud) Item -->
    <g transform="translate(15, 262)">
      <rect width="405" height="100" fill="#0f172a" stroke="#334155" rx="8"/>
      <circle cx="28" cy="28" r="16" fill="#f87171"/>
      <text x="28" y="34" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Ca/B</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="bold">Terminal Growing Bud Necrosis</text>
      <text x="56" y="46" fill="#cbd5e1" font-size="11">Apical bud dies back; hooked leaf tips; internal browning.</text>
      <text x="56" y="66" fill="#f87171" font-size="10" font-weight="bold">Diagnostic: Blossom-end rot (Ca), Hen &amp; Chicken disease / Hollow stem (B)</text>
    </g>

    <!-- Zn (Middle Leaves) Item -->
    <g transform="translate(15, 374)">
      <rect width="405" height="95" fill="#0f172a" stroke="#334155" rx="8"/>
      <circle cx="28" cy="28" r="16" fill="#38bdf8"/>
      <text x="28" y="34" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Zn</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="bold">Khaira Disease &amp; Rosetting / Little Leaf</text>
      <text x="56" y="46" fill="#cbd5e1" font-size="11">Rusty brown pigmentation on middle leaves; shortened internodes.</text>
      <text x="56" y="66" fill="#38bdf8" font-size="10" font-weight="bold">Diagnostic: Khaira disease of rice (discovered by Y.L. Nene, Pantnagar)</text>
    </g>
  </g>

  <!-- Bottom Key Comparison Tip -->
  <text x="480" y="598" fill="#e2e8f0" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">
    💡 High-Yield Exam Contrast: <tspan fill="#fbbf24">N = Older leaf chlorosis</tspan> vs <tspan fill="#fde047">S = Younger leaf chlorosis</tspan> | <tspan fill="#10b981">Mg = Older leaf interveinal</tspan> vs <tspan fill="#e2e8f0">Fe = Younger leaf interveinal</tspan>
  </text>
</svg>
