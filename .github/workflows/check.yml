name: Check
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
        pi: [current, legacy]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.pi == 'legacy'
        run: npm install --no-save --ignore-scripts --package-lock=false @earendil-works/pi-coding-agent@0.85.1 typebox@1.3.7
      - run: npm run check
      - run: npm run check:package
